name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 20.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `lint` runs the obsidianmd *recommended* preset. The community-plugin
      # review scanner runs every rule the plugin ships, including the ones that
      # only fire on manifest.json and the locale JSON - so the looser preset can
      # pass while the review fails. This gate is the scanner's view of the code.
      - name: Lint against the community-plugin review rules
        run: npm run lint:obsidian

      # Every user-facing string lives in all six locale bundles. A release that
      # adds a key to one bundle and not the others ships a blank label in five
      # languages, which the scanner tolerates but users do not.
      - name: Translations are in sync across all locales
        run: npm run translations:check

      # UI copy must go through the translator rather than being hard-coded, so
      # it can be localised at all. The check keeps a baseline of existing
      # literals and fails on new ones.
      - name: UI copy goes through the translator
        run: npm run i18n:literals:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # main.js lands in .obsidian/plugins/learnkit/ and Obsidian Sync syncs the
      # configuration folder. Sync enforces a per-file limit (5 MB on Standard),
      # so an oversized main.js silently never reaches the user's other devices.
      - name: Enforce bundle size budget
        run: npm run check:size

  # The Obsidian community-plugin review sandbox does not build from a git
  # checkout: it unpacks the GitHub *source archive*, and `git archive` honours
  # `.gitattributes` `export-ignore`. Stripping the build tooling there makes
  # `npm run build` die with MODULE_NOT_FOUND ("Cannot find module
  # .../tooling/esbuild.config.js") for the reviewer while passing locally.
  # This job reproduces that exact path so it can never regress.
  build-from-source-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 20.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm

      - name: Unpack source archive (honours .gitattributes export-ignore)
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/archive"

      - name: Install dependencies from the archive
        run: |
          cd "$RUNNER_TEMP/archive"
          npm ci

      - name: Build from the archive
        run: |
          cd "$RUNNER_TEMP/archive"
          npm run build

      - name: Check bundle size budget from the archive build
        run: |
          cd "$RUNNER_TEMP/archive"
          node tooling/check-bundle-size.mjs
